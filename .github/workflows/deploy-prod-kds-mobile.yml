name: Deploy KDS Mobile to Prod

on:
  push:
    tags:
      - 'kds-mobile@*'

jobs:
  build:
    name: Build Expo App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify EAS CLI
        run: eas --version

      - name: Build Expo
        run: |
          npx nx run kds-mobile:build \
          --platform=android \
          --profile=production \
          --non-interactive \
          --no-wait
