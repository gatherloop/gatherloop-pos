name: Deploy docs site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: npm ci

      # ORDER_APP_BASE_URL is a public URL, not a secret, but it lives in an
      # Actions variable rather than the workflow file so the order app's
      # host can change without editing this workflow — see D3 in
      # docs/trd-order-app-nextjs-migration.md.
      - name: Build docs site
        working-directory: docs-site
        run: npm run build
        env:
          ORDER_APP_BASE_URL: ${{ vars.ORDER_APP_BASE_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
